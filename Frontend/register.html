<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | RECIPE IT</title>
    <link rel="stylesheet" href="login.css">
    <script src="register.js" defer></script>
</head>
<body>
    <main class="login-container">
        <section class="image-section" aria-label="Recipe It">
            <div class="image-content">
                <div class="brand-lockup">
                    <span class="brand-kicker">Cook with what you have</span>
                    <div class="brand-title">RECIPE<span>IT</span><i aria-hidden="true"></i></div>
                </div>
                <p>Turn ingredients you already have into delicious meals.</p>
            </div>
        </section>

        <section class="form-section">
            <div class="login-box">
                <h1 class="auth-heading">Create your account</h1>
                <p class="subtitle">Find recipes for the ingredients you have.</p>

                <form id="register-form" action="/api/register" method="post">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email"
                           autocomplete="username" maxlength="254" required>

                    <label for="password">Password</label>
                    <p id="password-hint" class="field-hint">Use 8 to 128 characters.</p>
                    <div class="password-container">
                        <input type="password" id="password" name="password"
                               autocomplete="new-password" aria-describedby="password-hint"
                               minlength="8" maxlength="128" required>
                        <button type="button" id="toggle-password"
                                aria-controls="password confirm-password"
                                aria-label="Show passwords">Show</button>
                    </div>

                    <label for="confirm-password">Confirm password</label>
                    <input type="password" id="confirm-password"
                           autocomplete="new-password" required>

                    <button type="submit" class="login-btn">Create account</button>
                </form>
                <p id="message" class="register-message" role="status"></p>
                <p class="signup-text">Already have an account? <a href="login.html">Sign in</a></p>
            </div>
        </section>
    </main>
</body>
</html>
