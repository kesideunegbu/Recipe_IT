
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | RECIME</title>

    <link rel="stylesheet" href="login.css">
    <script src="login.js" defer></script>
</head>
<body>

    <main class="login-container">

        <!-- Left side: Recipe image -->
        <section class="image-section">
            <div class="image-content">
                <div class="brand-lockup">
                    <span class="brand-kicker">Cook with what you have</span>
                    <h1 class="brand-title" aria-label="RECIME">
                        RECI<span>ME</span><i aria-hidden="true"></i>
                    </h1>
                </div>
                <p>
                    Turn ingredients you already have
                    into delicious meals.
                </p>
            </div>
        </section>

        <!-- Right side: Login form -->
        <section class="form-section">
            <div class="login-box">

                <h2>Welcome Back!</h2>
                <p class="subtitle">
                    Sign in to discover your next meal.
                </p>

                <form id="login-form">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                    <label for="password">
                        Password
                    </label>

                    <div class="password-container">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="toggle-password"
                            aria-label="Show password"
                        >
                            Show
                        </button>
                    </div>

                    <a href="forgot-password.html"
                       class="forgot-password">
                        Forgot Password?
                    </a>

                    <p id="message" role="status"
                       aria-live="polite"></p>

                    <button type="submit"
                            class="login-btn">
                        Login
                    </button>

                </form>

                <p class="signup-text">
                    Don't have an account?
                    <a href="register.html">
                        Sign Up
                    </a>
                </p>

            </div>
        </section>

    </main>

</body>
</html>
